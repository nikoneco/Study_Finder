name: Check Study Finder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate standalone Pages
        run: |
          node tools/build-pages.js
          node tools/check-project.js
      - name: Ensure committed Pages output matches source
        run: git diff --exit-code -- docs
